name: Release Skill

on:
  push:
    branches:
      - "**"

permissions:
  contents: write

jobs:
  package-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install validation dependency
        run: python -m pip install --upgrade pip pyyaml

      - name: Install Node.js dependencies
        run: npm ci

      - name: Validate root skill structure
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import yaml

          root = Path(".")
          required_paths = [
              root / "SKILL.md",
              root / "agents" / "openai.yaml",
              root / "assets",
              root / "references",
              root / "scripts",
          ]
          missing = [str(path) for path in required_paths if not path.exists()]
          if missing:
              raise SystemExit(f"Missing required skill paths: {missing}")

          content = (root / "SKILL.md").read_text()
          match = re.match(r"^---\n(.*?)\n---", content, re.DOTALL)
          if not match:
              raise SystemExit("SKILL.md is missing valid YAML frontmatter.")

          frontmatter = yaml.safe_load(match.group(1))
          if not isinstance(frontmatter, dict):
              raise SystemExit("SKILL.md frontmatter must be a YAML object.")

          if frontmatter.get("name") != "skland-wiki-data":
              raise SystemExit("SKILL.md frontmatter name must be skland-wiki-data.")
          if not isinstance(frontmatter.get("description"), str) or not frontmatter["description"].strip():
              raise SystemExit("SKILL.md frontmatter description must be a non-empty string.")
          PY

      - name: Run local smoke tests
        run: |
          node --check scripts/convert.mjs
          node --check scripts/roundtrip-check.mjs
          node --check scripts/validate-xml.mjs
          python -m py_compile scripts/xml-inspect.py
          node scripts/roundtrip-check.mjs \
            --input assets/fixtures/sample-info-root.json | tee /tmp/roundtrip-output.json
          grep -q '"passed": true' /tmp/roundtrip-output.json
          node scripts/validate-xml.mjs \
            --input assets/fixtures/sample.xml | tee /tmp/validate-output.json
          grep -q '"valid": true' /tmp/validate-output.json

      - name: Build release archives
        run: |
          set -euo pipefail
          SHORT_SHA="${GITHUB_SHA::7}"
          PACKAGE_ROOT="dist/skland-wiki-data"
          mkdir -p "${PACKAGE_ROOT}"

          cp SKILL.md "${PACKAGE_ROOT}/"
          cp -R agents assets references scripts "${PACKAGE_ROOT}/"

          find "${PACKAGE_ROOT}" -type d -name '__pycache__' -prune -exec rm -rf {} +
          find "${PACKAGE_ROOT}" -type f \( -name '*.pyc' -o -name '.DS_Store' \) -delete

          (
            cd "${PACKAGE_ROOT}"
            zip -r "${OLDPWD}/dist/skland-wiki-data-${SHORT_SHA}.zip" . >/dev/null
            tar -czf "${OLDPWD}/dist/skland-wiki-data-${SHORT_SHA}.tar.gz" .
          )
          rm -rf "${PACKAGE_ROOT}"

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          SHORT_SHA="${GITHUB_SHA::7}"
          TAG="release-${GITHUB_SHA}"
          TITLE="skland-wiki-data ${SHORT_SHA}"
          NOTES=$(cat <<EOF
          Automated skill release for commit \`${GITHUB_SHA}\`.

          Included in the archive:
          - \`SKILL.md\`
          - \`agents/\`
          - \`assets/\`
          - \`references/\`
          - \`scripts/\`

          Excluded from the archive:
          - \`.github/\`
          - \`draft/\`
          - \`docs/\`
          - \`node_modules/\`
          - git metadata and local cache files
          EOF
          )

          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" \
              "dist/skland-wiki-data-${SHORT_SHA}.zip" \
              "dist/skland-wiki-data-${SHORT_SHA}.tar.gz" \
              --clobber
          else
            if [ "${GITHUB_REF_NAME}" = "${{ github.event.repository.default_branch }}" ]; then
              gh release create "${TAG}" \
                "dist/skland-wiki-data-${SHORT_SHA}.zip" \
                "dist/skland-wiki-data-${SHORT_SHA}.tar.gz" \
                --title "${TITLE}" \
                --notes "${NOTES}" \
                --target "${GITHUB_SHA}"
            else
              gh release create "${TAG}" \
                "dist/skland-wiki-data-${SHORT_SHA}.zip" \
                "dist/skland-wiki-data-${SHORT_SHA}.tar.gz" \
                --title "${TITLE}" \
                --notes "${NOTES}" \
                --target "${GITHUB_SHA}" \
                --prerelease
            fi
          fi
